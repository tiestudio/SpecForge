  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:           #0f0f0d;
      --ink-mid:       #4a4a46;
      --ink-faint:     #9a9a94;
      --paper:         #f7f6f2;
      --paper-mid:     #eeecea;
      --paper-dark:    #e4e2de;
      --accent:        #1a6b4a;
      --accent-light:  #d4ede3;
      --accent-mid:    #0f4730;
      --border:        rgba(15,15,13,0.1);
      --border-mid:    rgba(15,15,13,0.18);
      --serif:         'Instrument Serif', Georgia, serif;
      --sans:          'DM Sans', sans-serif;
      --r:             10px;
      --r-sm:          6px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--paper-mid);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .hd {
      background: var(--paper);
      border-bottom: 0.5px solid var(--border);
      padding: 1.1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .hd-logo { font-family: var(--serif); font-size: 1.15rem; }
    .hd-logo span { font-family: var(--sans); font-size: 12px; font-weight: 400; color: var(--ink-faint); margin-left: 6px; }
    .hd-right { display: flex; align-items: center; gap: 12px; }
    .hd-prog-bar { width: 100px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .hd-prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
    .hd-prog-lbl { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

    /* ── LAYOUT ── */
    .wrap { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }

    /* ── PHASE HEADER ── */
    .ph-eye { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
    .ph-title { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .ph-desc { font-size: 14px; color: var(--ink-mid); font-weight: 300; line-height: 1.6; margin-bottom: 2rem; }

    /* ── QUESTION CARD ── */
    .q {
      background: var(--paper);
      border: 0.5px solid var(--border);
      border-radius: var(--r);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .q:focus-within { border-color: var(--border-mid); }
    .q-lbl { font-size: 15px; font-weight: 500; display: block; margin-bottom: 0.25rem; }
    .q-help { font-size: 13px; color: var(--ink-faint); font-weight: 300; line-height: 1.55; margin-bottom: 0.75rem; }
    .q-help strong { color: var(--ink-mid); font-weight: 400; }
    .q-opt { display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--paper-dark); color: var(--ink-faint); margin-left: 8px; vertical-align: middle; }

    textarea, input[type="text"] {
      width: 100%; padding: 9px 12px;
      border: 0.5px solid var(--border-mid);
      border-radius: var(--r-sm);
      background: var(--paper-mid);
      color: var(--ink); font-size: 14px;
      font-family: var(--sans); font-weight: 300;
      line-height: 1.6; resize: vertical; outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    textarea { min-height: 72px; }
    textarea:focus, input[type="text"]:focus { border-color: var(--accent); background: var(--paper); }
    textarea::placeholder, input::placeholder { color: var(--ink-faint); }

    /* ── CHIPS ── */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      font-size: 13px; font-weight: 400;
      padding: 6px 14px; border-radius: 20px;
      border: 0.5px solid var(--border-mid);
      background: var(--paper-mid); color: var(--ink-mid);
      cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .chip:hover { border-color: var(--accent); color: var(--ink); background: var(--paper); }
    .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chip.on:hover { opacity: 0.85; }
    .chip.ranked { background: var(--accent); color: white; border-color: var(--accent); }
    .chip-rank { display: inline-block; background: rgba(255,255,255,0.3); border-radius: 10px; font-size: 10px; font-weight: 600; padding: 0 5px; margin-left: 4px; }

    /* ── MODE CARDS ── */
    .mode-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 0; }
    .mode-card {
      background: var(--paper); border: 1px solid var(--border-mid);
      border-radius: var(--r); padding: 1.25rem 1.5rem;
      cursor: pointer; transition: all 0.18s;
      display: flex; align-items: flex-start; gap: 1rem;
    }
    .mode-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(15,15,13,0.06); }
    .mode-card.sel { border-color: var(--accent); background: var(--accent-light); }
    .mode-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; line-height: 1; }
    .mode-card-title { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
    .mode-card-desc { font-size: 13px; color: var(--ink-mid); font-weight: 300; line-height: 1.5; }

    /* ── OPTION CARDS (illustrated) ── */
    .opt-cards { display: flex; flex-direction: column; gap: 8px; }
    .opt-card {
      background: var(--paper-mid); border: 0.5px solid var(--border-mid);
      border-radius: var(--r-sm); padding: 1rem 1.25rem;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .opt-card:hover { border-color: var(--accent); background: var(--paper); }
    .opt-card.sel { border-color: var(--accent); background: var(--accent-light); }
    .opt-card-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
    .opt-card-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .opt-card-desc { font-size: 13px; color: var(--ink-mid); font-weight: 300; line-height: 1.5; }

    /* ── FEATURE TILES ── */
    .tile-section { margin-bottom: 1.25rem; }
    .tile-section-lbl { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
    .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
    .tile {
      background: var(--paper-mid); border: 0.5px solid var(--border-mid);
      border-radius: var(--r-sm); padding: 0.875rem 1rem;
      cursor: pointer; transition: all 0.15s;
    }
    .tile:hover { border-color: var(--accent); background: var(--paper); }
    .tile.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .tile.on .tile-icon { filter: invert(1); }
    .tile.secondary { opacity: 0.7; }
    .tile.secondary:hover { opacity: 1; }
    .tile-icon { font-size: 1.1rem; margin-bottom: 5px; display: block; }
    .tile-name { font-size: 13px; font-weight: 500; }

    /* ── NAV ── */
    .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 1.75rem; gap: 1rem; }
    .btn-back {
      font-size: 14px; font-weight: 400;
      padding: 10px 18px; border-radius: var(--r-sm);
      border: 0.5px solid var(--border-mid);
      background: transparent; color: var(--ink-mid);
      cursor: pointer; transition: all 0.15s;
    }
    .btn-back:hover { background: var(--paper); color: var(--ink); }
    .btn-back:disabled { opacity: 0; pointer-events: none; }
    .btn-next {
      font-size: 14px; font-weight: 500;
      padding: 10px 22px; border-radius: var(--r-sm);
      border: none; background: var(--ink); color: var(--paper);
      cursor: pointer; transition: opacity 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-next:hover { opacity: 0.82; }

    /* ── EXPORT ── */
    .exp-steps { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 1.5rem; }
    .exp-step { background: var(--paper); padding: 1.1rem 1.25rem; display: flex; gap: 1rem; align-items: flex-start; }
    .exp-step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .exp-step-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
    .exp-step-desc { font-size: 13px; color: var(--ink-mid); font-weight: 300; line-height: 1.55; }
    .exp-step-desc a { color: var(--accent); text-decoration: underline; }

    .out-wrap { background: var(--paper); border: 0.5px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 1rem; }
    .out-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 1.25rem; border-bottom: 0.5px solid var(--border); background: var(--paper-mid); }
    .out-lbl { font-size: 12px; font-weight: 500; color: var(--ink-mid); }
    .out-copy { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: var(--r-sm); border: 0.5px solid var(--border-mid); background: var(--paper); color: var(--ink); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
    .out-copy:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .out-text { padding: 1.1rem 1.25rem; font-size: 12px; font-family: 'SF Mono','Fira Code',monospace; color: var(--ink-mid); white-space: pre-wrap; max-height: 260px; overflow-y: auto; line-height: 1.7; }

    .btn-green { width: 100%; padding: 13px; border-radius: var(--r-sm); border: none; background: var(--accent); color: white; font-size: 15px; font-weight: 500; font-family: var(--sans); cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-green:hover { opacity: 0.88; }
    .btn-ghost { padding: 10px 18px; border-radius: var(--r-sm); border: 0.5px solid var(--border-mid); background: transparent; color: var(--ink-mid); font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .btn-ghost:hover { background: var(--paper); color: var(--ink); }

    .confirm { font-size: 12px; color: var(--accent); opacity: 0; transition: opacity 0.3s; }
    .confirm.show { opacity: 1; }

    /* ── ANIM ── */
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .phase { animation: fadeIn 0.3s ease; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hd { padding: 1rem 1.25rem; }
      .wrap { padding: 1.5rem 1rem 5rem; }
      .q { padding: 1rem 1.1rem; }
      .tile-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

function getPhases() {

  if (d.mode === 'greenfield') return [

    renderFeatures, renderContext, renderIntegrationsDesign,

// ─── HELPERS ─────────────────────────────────────────────────────────────

function chip(key, val, label, multi, ranked=false) {
  const arr = multi ? (d[key]||[]) : null;
  const isOn = multi ? arr.includes(val) : d[key] === val;
  const rank = ranked && isOn ? d[key].indexOf(val) + 1 : null;
  return `<button class="chip${isOn?(ranked?' ranked':' on'):''}"
    onclick="toggleChip('${key}','${val}',${multi},${ranked})"
    >${label}${rank ? `<span class="chip-rank">${rank}</span>` : ''}</button>`;
}

function toggleChip(key, val, multi, ranked=false) {
  if (multi) {
    if (!d[key]) d[key] = [];
    const i = d[key].indexOf(val);
    if (i >= 0) d[key].splice(i,1);
    else {
      if (ranked && d[key].length >= 3) return;
      d[key].push(val);
    }
  } else {
    d[key] = val;
  }
  render();
}

function modeCard(val, icon, title, desc) {
  return `<div class="mode-card${d.mode===val?' sel':''}" onclick="d.mode='${val}';render()">
    <div class="mode-icon">${icon}</div>
    <div>
      <div class="mode-card-title">${title}</div>
      <div class="mode-card-desc">${desc}</div>
    </div>
  </div>`;
}

function optCard(key, val, icon, title, desc, single=true) {
  const isOn = single ? d[key]===val : (d[key]||[]).includes(val);
  return `<div class="opt-card${isOn?' sel':''}" onclick="toggleChip('${key}','${val}',${!single})">
    <div class="opt-card-icon">${icon}</div>
    <div>
      <div class="opt-card-title">${title}</div>
      <div class="opt-card-desc">${desc}</div>
    </div>
  </div>`;
}

function tile(key, val, icon, label, secondary=false) {
  const isOn = (d[key]||[]).includes(val);
  return `<div class="tile${isOn?' on':''}${secondary?' secondary':''}" onclick="toggleTile('${key}','${val}')">
    <span class="tile-icon">${icon}</span>
    <span class="tile-name">${label}</span>
  </div>`;
}

function toggleTile(key, val) {
  if (!d[key]) d[key] = [];
  const i = d[key].indexOf(val);
  i >= 0 ? d[key].splice(i,1) : d[key].push(val);
  render();
}

function field(key, label, help, eg='', rows=3, opt=false) {
  const optBadge = opt ? '<span class="q-opt">Optional</span>' : '';
  const egHtml = eg ? `<strong>Example:</strong> "${eg}"` : '';
  return `<div class="q">
    <label class="q-lbl">${label}${optBadge}</label>
    <p class="q-help">${help}${eg ? ' ' + egHtml : ''}</p>
    <textarea rows="${rows}" oninput="d['${key}']=this.value">${d[key]||''}</textarea>
  </div>`;
}

function sfield(key, label, help, eg='', opt=false) {
  const optBadge = opt ? '<span class="q-opt">Optional</span>' : '';
  const egHtml = eg ? `<strong>Example:</strong> "${eg}"` : '';
  return `<div class="q">
    <label class="q-lbl">${label}${optBadge}</label>
    <p class="q-help">${help}${eg ? ' ' + egHtml : ''}</p>
    <input type="text" value="${(d[key]||'').replace(/"/g,'&quot;')}" oninput="d['${key}']=this.value">
  </div>`;
}

function chipsQ(key, label, help, options, multi=false, ranked=false) {
  return `<div class="q">
    <label class="q-lbl">${label}</label>
    <p class="q-help">${help}</p>
    <div class="chips">${options.map(o=>chip(key,o.v,o.label,multi,ranked)).join('')}</div>
  </div>`;
}

function nav(backLabel='← Back', nextLabel='Continue →') {
  const phases = getPhases();
  const isFirst = step === 0;
  const isLast = step === phases.length - 1;
  return `<div class="nav">
    <button class="btn-back" onclick="prev()" ${isFirst?'disabled':''}>${backLabel}</button>
    <button class="btn-next" onclick="next()">${isLast ? 'Done ✓' : nextLabel}</button>
  </div>`;
}

function progress() {
  const phases = getPhases();
  const total = phases.length - 1;
  const pct = total > 0 ? Math.round((step/total)*100) : 0;
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('prog-lbl').textContent = step === 0 ? '' : `Step ${step} of ${total}`;
}

    <div class="ph-desc">Describe the project as it stands today. Be honest — the spec is most useful when it reflects reality.</div>

    ${field('retProjectDesc','What does this project do, and what state is it in?',
      'Describe it plainly. Is it a prototype? Live? Half-built?',
      'A booking tool for yoga studios. The calendar works and people can book classes, but payments are broken and there\'s no way to cancel.',4)}

    ${field('retTech','What tech is it built on?',
      'Describe it however you know it — framework name, tools used, anything you\'re aware of.',

      <div class="opt-cards">
        ${optCard('retHealth','good','◎','Mostly working — just needs more features','The core product functions. You want to build on top of it.')}
        ${optCard('retHealth','partial','◈','Partially working — some things are broken','Key parts function but there are known problems to fix.')}
        ${optCard('retHealth','proto','◇','Early prototype — significant parts are missing','It\'s a sketch of the product, not a working version.')}
        ${optCard('retHealth','live','◉','Live with real users — needs to keep working','Real people use it. Changes must not break existing functionality.')}
      </div>
    </div>

    <div class="q">
      <label class="q-lbl">What problems are you aware of?</label>
      <p class="q-help">Select all that apply. These become flagged as technical debt in the spec.</p>
      <div class="chips">
        ${[
          {v:'breaks',    label:'Things break when I change something'},
          {v:'hardcoded', label:'Only works for one specific case — hardcoded'},
          {v:'inconsist', label:'Design is inconsistent across different parts'},
          {v:'slow',      label:'It\'s slow to load or respond'},
          {v:'notests',   label:'No tests — afraid to change things'},
          {v:'lost',      label:'I\'ve lost track of what the code does'},
          {v:'dbwrong',   label:'The database structure feels wrong'},
        ].map(o=>chip('retProblems',o.v,o.label,true)).join('')}
      </div>
    </div>

    ${nav()}
  </div>`;
}

// ─── OUTPUT BUILDERS ─────────────────────────────────────────────────────

function buildSummary() {
  const lines = ['## SpecForge Interview — Compiled Answers', ''];

  if (d.mode === 'greenfield') {
    const cat  = CATEGORIES.find(c=>c.v===d.category);
    const prob = PROBLEMS.find(p=>p.v===d.problem);
    const acts = (d.actions||[]).map(a=>ACTIONS.find(x=>x.v===a)?.label||a);

    // Map feature tile values to human-readable labels
    const allTiles = [...UNIVERSAL_TILES, ...(CATEGORY_TILES[d.category]||[]), ...SECONDARY_TILES];
    const featLabels = (d.features||[]).map(v=>allTiles.find(t=>t.v===v)?.label||v);
    const feats = featLabels.join(', ') + (d.featuresOther ? ', ' + d.featuresOther : '');

    const outs  = (d.outScope||[]).map(v=>OUTSCOPE_TILES.find(t=>t.v===v)?.label||v).join(', ') + (d.outScopeOther?', '+d.outScopeOther:'');

    // Map auth method values to readable labels
    const authLabels = {
      emailpass:'Email and password', google:'Sign in with Google',
      github:'Sign in with GitHub', magic:'Magic link',
      none:'No login needed', invite:'Invite only'
    };
    const auths = (d.authMethods||[]).map(v=>authLabels[v]||v).join(', ');

    // Map integration values to labels with tool names
    const intLabels = {
      payments:'Take payments (→ Stripe)', emails:'Send emails (→ Resend)',
      sms:'Send SMS (→ Twilio)', files:'Store files (→ Supabase Storage)',
      maps:'Show maps (→ Mapbox)', gcal:'Calendar sync (→ Google Calendar)',
      analytics:'Analytics (→ Plausible)'
    };
    const ints  = (d.integrations||[]).map(v=>intLabels[v]||v).join(', ');
    const tools = (d.existingTools||[]).map(v=>EXISTING_TOOLS.find(t=>t.v===v)?.label||v).join(', ') + (d.existingToolsOther?', '+d.existingToolsOther:'');

    // User type labels
    const userTypeLabels = {
      public:'Consumers / general public', smb:'Small business owners',
      freelance:'Freelancers / solopreneurs', teams:'Teams inside a company',
      devs:'Developers / technical users', creators:'Creators / content makers',
      solo:'Just me — single user only'
    };
    const userTypes = (d.userTypes||[]).map(v=>userTypeLabels[v]||v).join(', ');

    lines.push(
      `**Mode:** New project (Greenfield)`, '',
      `### Product`,
      `Category: ${cat?.label||d.category||'—'}`,
      `Description: ${d.productDesc||'—'}`,
      `Additional notes: ${d.productDesc_phase||'—'}`, '',
      `### Users`,
      `User types: ${userTypes||'—'}`,
      `User detail: ${d.userDetail||'—'}`,
      `Core problem: ${prob?.label||d.problem||'—'}`, '',
      `### Actions`,
      `Primary actions (ranked): ${acts.join(' → ')||'—'}`, '',
      `### Features`,
      `Included: ${feats||'—'}`,
      `Out of scope: ${outs||'—'}`, '',
      `### Context`,
      `Who uses it: ${d.context||'—'}`,
      `Data type: ${d.dataType||'—'}`,
      `Authentication: ${auths||'—'}`,
      `Hosting notes: ${d.hostingNotes||'—'}`, '',
      `### Integrations`,
      `Functional: ${ints||'—'}`,
      `Existing tools: ${tools||'—'}`, '',
      `### Design Direction`,
      `Colour mood: ${d.colorMood||'—'}`,
      `Font style: ${d.fontStyle||'—'}`,
      `Corner style: ${d.cornerStyle||'—'}`,
      `Density: ${d.density||'—'}`, '',
      `### Technical`,
      `Performance: ${d.performance||'—'}`,
      `Accessibility: ${d.accessibility||'—'}`,
      `Phase size: ${d.phaseSize||'—'}`,
    );
  }

  else if (d.mode === 'retrofit') {
    const probs = (d.retProblems||[]).join(', ');
    lines.push(
      `**Mode:** Existing project (Retrofit)`, '',
      `### Current State`,
      `What it does: ${d.retProjectDesc||'—'}`,
      `Tech: ${d.retTech||'—'}`,
      `Health: ${d.retHealth||'—'}`,
      `Problems: ${probs||'—'}`, '',
      `### What Exists`,
      `What works: ${d.retWorks||'—'}`,
      `What's broken: ${d.retBroken||'—'}`,
      `Early mistakes: ${d.retRegrets||'—'}`, '',
      `### What's Next`,
      `Next features or fixes: ${d.retNext||'—'}`,
      `Out of scope: ${d.retOutScope||'—'}`,
      `Existing tools / constraints: ${d.retExistingTools||'—'}`,
    );
  }

  else if (d.mode === 'feature') {
    const flow  = FLOW_PATTERNS.find(f=>f.v===d.flowPattern);
    const comps = (d.componentTypes||[]).map(v=>COMPONENT_TYPES.find(c=>c.v===v)?.label||v).join(', ');
    const edges = (d.edgesUniversal||[]).map(v=>UNIVERSAL_EDGES.find(e=>e.v===v)?.label||v).join(', ');
    lines.push(
      `**Mode:** Feature spec`, '',
      `### Feature`,
      `Name: ${d.featName||'—'}`,
      `What it does: ${d.featWhat||'—'}`,
      `Flow pattern: ${flow?.label||'—'}`,
      `User flow: ${d.featFlow||'—'}`, '',
      `### Details`,
      `Error cases: ${d.featureEdge||'—'}`,
      `Edge cases: ${edges||'—'}`,
      `UI elements: ${comps||'—'}`,
      `How to verify: ${d.featSuccess||'—'}`,
    );
  }

  return lines.join('\n');
}

function buildPrompt(summary) {
  return `I've filled in the SpecForge interview form. Please read my answers, identify any gaps or things worth clarifying, ask only the follow-up questions that are genuinely needed, then generate my full spec bundle.

${summary}`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────

function next() {
  const phases = getPhases();
  if (step === 3 && d.mode === 'greenfield') prePopulateOutScope();
  if (step < phases.length - 1) { step++; render(); window.scrollTo(0,0); }
}

function prev() {
  if (step > 0) { step--; render(); window.scrollTo(0,0); }
}

function startOver() {
  step = 0;
  d = {
    mode:null, exportTarget:'claudecode',
    category:null, categoryOther:'',
    productDesc:'', userTypes:[], userDetail:'',
    problem:null, problemOther:'',
    actions:[], primaryAction:null,
    features:[], featuresOther:'',
    outScope:[], outScopeOther:'',
    context:null, dataType:null, authMethods:[],
    hostingNotes:'',
    integrations:[], existingTools:[], existingToolsOther:'',
    colorMood:null, fontStyle:null, cornerStyle:null, density:null,
    performance:null, accessibility:null, phaseSize:null,
    retProjectDesc:'', retTech:'', retHealth:null, retProblems:[],
    retWorks:'', retBroken:'', retRegrets:'',
    retNext:'', retOutScope:'', retExistingTools:'',
    featName:'', featWhat:'', featFlow:'',
    flowPattern:null, uiStates:[], edgesUniversal:[], edgesFeature:[],
    componentTypes:[], featSuccess:'', featureEdge:'',
  };
  render();
  window.scrollTo(0,0);
}

function copyPrompt() {
  const prompt = buildPrompt(buildSummary());
  navigator.clipboard.writeText(prompt).then(() => {
    const el = document.getElementById('copy-confirm');
    if (el) { el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2000); }
  }).catch(()=>{});
}

// ─── RENDER ───────────────────────────────────────────────────────────────

function render() {
  const phases = getPhases();
  const renderer = phases[step];
  document.getElementById('root').innerHTML = renderer ? renderer() : '';
  progress();
}

render();
</script>
